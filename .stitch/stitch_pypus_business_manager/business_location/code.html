<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pypus Onboarding — Business Location</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "primary-container": "#00ff41",
                    "on-primary-container": "#007117",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#131b2e",
                    "on-primary-fixed": "#002203",
                    "tertiary-fixed": "#ffddb8",
                    "primary-fixed": "#72ff70",
                    "on-surface": "#131b2e",
                    "background": "#faf8ff",
                    "on-secondary-container": "#fffbff",
                    "inverse-surface": "#283044",
                    "on-secondary-fixed-variant": "#2f2ebe",
                    "surface-container": "#eaedff",
                    "tertiary": "#855300",
                    "surface-bright": "#faf8ff",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#6063ee",
                    "secondary-fixed": "#e1e0ff",
                    "on-tertiary-fixed-variant": "#653e00",
                    "secondary-fixed-dim": "#c0c1ff",
                    "on-secondary-fixed": "#07006c",
                    "error-container": "#ffdad6",
                    "tertiary-container": "#ffd6a8",
                    "surface-dim": "#d2d9f4",
                    "inverse-on-surface": "#eef0ff",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#dae2fd",
                    "on-tertiary-fixed": "#2a1700",
                    "outline": "#6b7c65",
                    "secondary": "#4648d4",
                    "inverse-primary": "#00e639",
                    "surface": "#faf8ff",
                    "surface-container-low": "#f2f3ff",
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-variant": "#dae2fd",
                    "on-tertiary": "#ffffff",
                    "primary": "#006e16",
                    "on-tertiary-container": "#895600",
                    "primary-fixed-dim": "#00e639",
                    "surface-container-high": "#e2e7ff",
                    "surface-tint": "#006e16",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#00530e",
                    "outline-variant": "#b9ccb2",
                    "on-surface-variant": "#3b4b37"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "margin-mobile": "20px",
                    "sm": "8px",
                    "gutter": "16px",
                    "md": "16px",
                    "base": "4px",
                    "lg": "24px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "label-bold": ["Inter"],
                    "body-md": ["Inter"],
                    "stats-display": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-xl": ["Inter"]
            },
            "fontSize": {
                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "stats-display": ["32px", {"lineHeight": "40px", "fontWeight": "800"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #faf8ff;
            color: #131b2e;
            -webkit-font-smoothing: antialiased;
        }
        .glass-lite {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .active-interaction:active {
            transform: scale(0.96);
            transition: transform 0.1s ease-out;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00ff41 !important;
            box-shadow: 0 0 0 1px #00ff41;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Top AppBar (Simplified for Onboarding Context) -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 px-margin-mobile py-sm flex justify-between items-center w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">business_center</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary">Pypus</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">help_outline</span>
</button>
</header>
<main class="flex-grow flex flex-col px-margin-mobile py-lg max-w-md mx-auto w-full">
<!-- Progress Bar Section -->
<div class="mb-xl">
<div class="flex justify-between items-end mb-2">
<span class="font-label-bold text-label-bold text-primary uppercase tracking-wider">Step 4 of 4</span>
<span class="font-label-bold text-label-bold text-on-surface-variant">Almost there</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[100%] transition-all duration-1000 ease-out shadow-[0_0_12px_rgba(0,255,65,0.4)]" id="progress-bar"></div>
</div>
</div>
<!-- Headline Area -->
<div class="mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Where is your business located?</h2>
<p class="text-on-surface-variant text-body-md opacity-80">This helps us customize local regulations and tax settings for your region.</p>
</div>
<!-- Map Preview Card -->
<div class="relative mb-lg group">
<div class="w-full h-48 rounded-lg overflow-hidden border border-outline-variant/30 shadow-sm relative">
<!-- Using data-location for map as requested -->
<div class="w-full h-full bg-surface-container-high flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A stylized, modern vector map visualization showing a clean urban street grid in soft pastel blues and greens. A vibrant Terminal Green location pin is centered over a sleek building icon. The lighting is bright and professional, mimicking a high-end SaaS dashboard interface with gentle glassmorphism overlays." data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqGo3w2scdHNIloHwAAcsYdHQdRuHutWFCx6GdoeviucFk-Gpzg644aBad6Uy6-S4kGBulmQS5editnxSA9JrO-MqsOGU04MAPVQtpoNog9q-U18weYuRmaCOGhdP7rBRR2GodMkda365FGglkBvZdio9AgpzzNTU7GDNA-h8qKv327AoMDf4oRsMAz-dxigJlEVG_7a30w3kpK2UdrIGMbWQte13OAGx6K753WqW6DtLjoIElW1Mn"/>
</div>
<!-- Confirmation Chip -->
<div class="absolute top-4 right-4 bg-primary-container text-on-primary-container font-label-bold text-label-bold px-3 py-1 rounded-full flex items-center gap-1 shadow-lg animate-bounce" id="location-chip">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Location Set
                </div>
</div>
</div>
<!-- Primary Action: Current Location -->
<button class="w-full bg-primary-container text-on-primary-container py-lg rounded-lg flex items-center justify-center gap-3 font-label-bold text-headline-lg-mobile active-interaction shadow-md hover:shadow-lg transition-all mb-xl border-2 border-primary/20">
<span class="material-symbols-outlined text-3xl">my_location</span>
            Use my current location
        </button>
<!-- Manual Fallback Section -->
<div class="space-y-gutter">
<div class="flex items-center gap-4 mb-2">
<div class="h-px flex-grow bg-outline-variant/30"></div>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase">Or enter manually</span>
<div class="h-px flex-grow bg-outline-variant/30"></div>
</div>
<!-- Address Input -->
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Street Address</label>
<div class="relative">
<input class="w-full bg-white border-2 border-outline-variant/30 rounded-md px-4 py-3 text-body-md focus:ring-0 transition-colors" placeholder="123 Business Way, Suite 100" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-3.5 text-on-surface-variant opacity-50">map</span>
</div>
</div>
<!-- Dropdown Row -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">State</label>
<div class="relative">
<select class="w-full appearance-none bg-white border-2 border-outline-variant/30 rounded-md px-4 py-3 text-body-md focus:ring-0 transition-colors">
<option>California</option>
<option>New York</option>
<option>Texas</option>
<option>Florida</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="space-y-1">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">District</label>
<div class="relative">
<select class="w-full appearance-none bg-white border-2 border-outline-variant/30 rounded-md px-4 py-3 text-body-md focus:ring-0 transition-colors">
<option>Downtown</option>
<option>Tech Hub</option>
<option>Financial Dist.</option>
<option>East Side</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Spacer for content flow -->
<div class="h-xl"></div>
<!-- Sticky Footer Action -->
<div class="mt-auto pt-lg">
<button class="w-full bg-primary text-white py-4 rounded-full font-label-bold text-body-md active-interaction shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-label-bold text-on-surface-variant mt-4 opacity-60">You can change this later in settings.</p>
</div>
</main>
<!-- Background Atmospheric Effect (Subtle Shader-like Gradient) -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-secondary-container/10 rounded-full blur-[100px]"></div>
</div>
<script>
        // Simple micro-interaction for the location chip visibility toggle
        document.querySelector('input').addEventListener('input', (e) => {
            const chip = document.getElementById('location-chip');
            if (e.target.value.length > 5) {
                chip.style.opacity = '1';
                chip.style.transform = 'translateY(0)';
            } else {
                chip.style.opacity = '0';
                chip.style.transform = 'translateY(-10px)';
            }
        });

        // Initialize chip state
        window.addEventListener('DOMContentLoaded', () => {
            const chip = document.getElementById('location-chip');
            chip.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        });
    </script>
</body></html>
