<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pypus — Phone Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "primary-container": "#00ff41",
                        "on-primary-container": "#007117",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#131b2e",
                        "on-primary-fixed": "#002203",
                        "tertiary-fixed": "#ffddb8",
                        "primary-fixed": "#72ff70",
                        "on-surface": "#131b2e",
                        "background": "#faf8ff",
                        "on-secondary-container": "#fffbff",
                        "inverse-surface": "#283044",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "surface-container": "#eaedff",
                        "tertiary": "#855300",
                        "surface-bright": "#faf8ff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#6063ee",
                        "secondary-fixed": "#e1e0ff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-secondary-fixed": "#07006c",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#ffd6a8",
                        "surface-dim": "#d2d9f4",
                        "inverse-on-surface": "#eef0ff",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#dae2fd",
                        "on-tertiary-fixed": "#2a1700",
                        "outline": "#6b7c65",
                        "secondary": "#4648d4",
                        "inverse-primary": "#00e639",
                        "surface": "#faf8ff",
                        "surface-container-low": "#f2f3ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-variant": "#dae2fd",
                        "on-tertiary": "#ffffff",
                        "primary": "#006e16",
                        "on-tertiary-container": "#895600",
                        "primary-fixed-dim": "#00e639",
                        "surface-container-high": "#e2e7ff",
                        "surface-tint": "#006e16",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#00530e",
                        "outline-variant": "#b9ccb2",
                        "on-surface-variant": "#3b4b37"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "gutter": "16px",
                        "md": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "body-md": ["Inter"],
                        "stats-display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-xl": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "stats-display": ["32px", {"lineHeight": "40px", "fontWeight": "800"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],

                        "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}]

            },
        }

<style>
        body {
            background-color: #faf8ff;
            color: #131b2e;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-active:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden">
<!-- Onboarding suppression logic: No TopAppBar or BottomNavBar as this is a focused task -->
<main class="flex-grow flex flex-col px-margin-mobile pt-xl pb-xl max-w-md mx-auto w-full relative">
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-xl">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex-grow mx-lg h-2 bg-surface-container rounded-full overflow-hidden relative">
<div class="absolute inset-y-0 left-0 bg-primary-container w-3/4 rounded-full transition-all duration-500 ease-out"></div>
</div>
<span class="font-label-bold text-label-bold text-on-surface-variant/60">3/4</span>
</div>
<!-- Header Section -->
<div class="mb-xl animate-fade-in">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Verify your phone number</h1>
<p class="text-on-surface-variant">We'll send a secure verification code to this number to protect your account.</p>
</div>
<!-- Verification Card -->
<div class="glass-card p-lg rounded-lg shadow-sm mb-lg">
<div class="flex flex-col gap-md">
<!-- Phone Input Group -->
<div class="relative">
<label class="font-label-bold text-label-bold text-primary mb-xs block" for="phone-input">PHONE NUMBER</label>
<div class="flex gap-sm">
<!-- Prefix Chip -->
<div class="flex items-center px-md py-md bg-surface-container-low border-2 border-outline-variant/30 rounded-DEFAULT font-bold text-on-surface">
                            +91
                        </div>
<!-- Numeric Input -->
<div class="flex-grow relative">
<input class="w-full bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container focus:ring-0 rounded-DEFAULT px-md py-md font-bold tracking-widest text-on-surface placeholder:text-on-surface-variant/30 transition-all outline-none" id="phone-input" inputmode="numeric" pattern="[0-9]*" placeholder="00000 00000" type="tel"/>
</div>
</div>
</div>
<!-- Verified Badge -->
<div class="flex items-center gap-xs mt-xs">
<div class="flex items-center bg-primary-container/10 px-sm py-1 rounded-full border border-primary-container/20">
<span class="material-symbols-outlined text-[14px] text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-bold text-[10px] text-on-primary-container ml-xs">VERIFIED VIA GOOGLE</span>
</div>
</div>
</div>
</div>
<!-- Decorative illustration/Background Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -z-10 opacity-40 blur-3xl w-72 h-72 rounded-full bg-gradient-to-tr from-primary-container to-secondary-container pointer-events-none"></div>
<!-- Footer Actions -->
<div class="mt-auto flex flex-col gap-md">
<p class="text-center font-label-bold text-[11px] text-on-surface-variant/50 px-lg">
                By continuing, you agree to receive an SMS for verification. Message and data rates may apply.
            </p>
<button class="btn-active w-full bg-primary-container text-on-primary-container font-label-bold py-lg rounded-DEFAULT shadow-lg shadow-primary-container/20 flex items-center justify-center gap-sm transition-all hover:brightness-105">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        // Simple numeric input formatter
        const phoneInput = document.getElementById('phone-input');
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 10) value = value.slice(0, 10);
            
            // Add a space for readability after 5 digits
            if (value.length > 5) {
                e.target.value = value.slice(0, 5) + ' ' + value.slice(5);
            } else {
                e.target.value = value;
            }
        });

        // Entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transform = 'translateY(10px)';
            main.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            requestAnimationFrame(() => {
                main.style.opacity = '1';
                main.style.transform = 'translateY(0)';
            });
        });
    </script>
</body></html>
