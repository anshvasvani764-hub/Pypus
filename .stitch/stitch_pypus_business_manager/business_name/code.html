<!DOCTYPE html><html class="light" lang="en"><head>

            border-color: #006e16;

            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;

                        "error-container": "#ffdad6",

<body class="bg-background text-on-background min-h-screen flex flex-col gradient-bg">
<!-- Navigation Shell Suppressed for Transactional Onboarding Flow as per Mandate -->
<main class="flex-grow flex flex-col px-margin-mobile pt-xl pb-lg max-w-lg mx-auto w-full">
<!-- Header & Progress -->
<div class="flex flex-col gap-lg mb-xl animate-slide-up">
<div class="flex items-center justify-between">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface hover:bg-surface-container-highest transition-all active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;wght&quot; 600;">arrow_back</span>
</button>
<div class="flex flex-col items-end">
<span class="font-label-bold text-label-bold text-on-surface-variant/60 uppercase tracking-widest">Step 2 of 4</span>
<div class="h-1.5 w-32 bg-outline-variant/30 rounded-full mt-2 overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-700 ease-out" style="width: 50%;"></div>
</div>
</div>
</div>
<div class="mt-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background leading-tight">
                    What's the name of <br>
<span class="text-primary">your Gym?</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">This is how your brand will appear to your clients and staff.</p>
</div>
</div>
<!-- Form Section -->
<div class="flex-grow flex flex-col gap-lg animate-slide-up" style="animation-delay: 0.1s;">
<div class="relative">
<label class="sr-only" for="business_name">Business Name</label>
<input class="w-full bg-white border-2 border-outline-variant rounded-lg p-lg font-headline-lg-mobile text-headline-lg-mobile text-on-surface input-focus-ring transition-all placeholder:text-on-surface-variant/30" id="business_name" placeholder="e.g. Iron Temple Fitness" type="text">
<!-- Error Message -->
<div class="flex items-center gap-2 mt-4 text-error" id="error_container">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &quot;FILL&quot; 1;">error</span>
<p class="font-label-bold text-label-bold uppercase">Name cannot be empty</p>
</div>
</div>
<!-- Visual Context Card -->
<div class="mt-auto pt-xl">

</div>
</div>
<!-- Footer Actions -->
<div class="mt-xl flex flex-col gap-md animate-slide-up" style="animation-delay: 0.2s;">
<button class="w-full bg-primary-container text-on-primary-container py-lg rounded-lg font-headline-lg-mobile text-headline-lg-mobile shadow-[0_8px_20px_-4px_rgba(0,255,65,0.4)] active:scale-[0.98] transition-transform hover:brightness-105">
                Continue
            </button>
<p class="text-center font-label-bold text-label-bold text-on-surface-variant/50 px-8">
                By continuing, you agree to Pypus’s Terms of Service and Privacy Policy.
            </p>
</div>
</main>
<script>
        // Simple micro-interaction for input reactivity
        const input = document.getElementById('business_name');
        const previewText = document.getElementById('preview_text');
        const errorContainer = document.getElementById('error_container');

        input.addEventListener('input', (e) => {
            const val = e.target.value;
            previewText.textContent = val || "Iron Temple Fitness";
            
            // Toggle error state visually
            if (val.trim() === "") {
                errorContainer.classList.remove('opacity-0');
                input.classList.add('border-error');
                input.classList.remove('border-primary');
            } else {
                errorContainer.classList.add('opacity-0');
                input.classList.remove('border-error');
                input.classList.add('border-primary');
            }
        });

        // Initialize with error visible as requested
        document.addEventListener('DOMContentLoaded', () => {
            input.focus();
        });
    </script>


</body></html>
